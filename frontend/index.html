<!DOCTYPE html>
<html>
<head>
  <title>Job SaaS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; background:#f5f5f5; }
    .box { background:white; padding:15px; margin-bottom:15px; border-radius:10px; }
    button { padding:8px 12px; margin-top:5px; }
    input { padding:8px; margin:5px; }
  </style>
</head>

<body>

<h1>🚀 SaaS Job Dashboard</h1>

<div class="box">
  <h3>Scrape data</h3>
  <button onclick="scrape()">Run scraper</button>
</div>

<div class="box">
  <h3>Stats</h3>
  <button onclick="loadStats()">Load stats</button>
  <canvas id="chart"></canvas>
</div>

<div class="box">
  <h3>Jobs</h3>
  <button onclick="loadJobs()">Load jobs</button>
  <div id="jobs"></div>
</div>

<script>

const API = "http://127.0.0.1:8000";

let chart;

async function scrape() {
  await fetch(API + "/scrape", { method: "POST" });
  alert("Scraped!");
  loadStats();
  loadJobs();
}

async function loadStats() {
  const res = await fetch(API + "/debug-db");
  const data = await res.json();

  const count = data.count[0];

  const ctx = document.getElementById("chart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Jobs"],
      datasets: [{
        label: "Total jobs",
        data: [count]
      }]
    }
  });
}

async function loadJobs() {
  const res = await fetch(API + "/jobs");
  const data = await res.json();

  document.getElementById("jobs").innerHTML =
    data.jobs.map(j =>
      `<p><b>${j.title}</b> - ${j.company} (${j.location})</p>`
    ).join("");
}

</script>

</body>
